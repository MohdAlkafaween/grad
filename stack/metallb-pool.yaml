apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: falcon-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.25.168.240-172.25.168.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: falcon-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - falcon-pool
